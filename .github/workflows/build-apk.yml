name: Build and Release APK

on:
  push:
    branches:
      - master
  release:
    types: [created, published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
      
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        
      - name: Create keystore
        run: |
          # Create a keystore with no password for self-signing
          keytool -genkey -v -keystore app/release.keystore -alias release -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=AndroidMessageForwarder, OU=Development, O=GordArg, L=Unknown, ST=Unknown, C=US"
        
      - name: Build Release APK
        run: |
          # Build with signing configuration
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/release.keystore \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=release \
            -Pandroid.injected.signing.key.password=android
          
      - name: Prepare APK
        run: |
          # Find the APK and copy to standard location
          find app/build/outputs/apk/release -name "*.apk" -type f -exec cp {} app/build/outputs/apk/release/app-release.apk \;
          ls -lh app/build/outputs/apk/release/
          
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v3
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
  
  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: write
      
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v3
        with:
          name: app-release
          
      - name: Upload APK to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: app-release.apk
          asset_name: AndroidMessageForwarder-${{ github.event.release.tag_name }}.apk
          asset_content_type: application/vnd.android.package-archive
